services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: flightsim
      POSTGRES_PASSWORD: flightsim
      POSTGRES_DB: flightsim
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U flightsim -d flightsim"]
      interval: 2s
      timeout: 3s
      retries: 20

  backend:
    build: ./backend
    environment:
      DATABASE_URL: postgresql+psycopg://flightsim:flightsim@db:5432/flightsim
      NUM_AIRCRAFT: 5
      SIM_TIME_SCALE: 30
    command: >
      sh -c "alembic upgrade head &&
             uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload"
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/app
    depends_on:
      db:
        condition: service_healthy

  frontend:
    build: ./frontend
    environment:
      VITE_API_PROXY_TARGET: http://backend:8000
    ports:
      - "${FRONTEND_PORT:-5173}:5173"
    volumes:
      - ./frontend:/app
      - /app/node_modules  # keep the image's node_modules, not the host's
    depends_on:
      - backend

volumes:
  pgdata:
